name: Jira Re-verification

on:
  workflow_dispatch:
    inputs:
      jira_issue:
        description: Existing Jira issue to update
        required: true
        type: string
      test_case_id:
        description: Deterministic Playwright test case ID
        required: false
        type: string
      module:
        description: Module tag without @
        required: false
        type: string
      target_mode:
        description: Verification scope
        required: true
        default: test
        type: choice
        options: [test, module, suite, full]
      test_environment:
        description: Environment to test
        required: true
        default: beta
        type: choice
        options: [beta, staging, production]
      base_url:
        description: Required URL override for staging; optional for other environments
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_ENV: ${{ inputs.test_environment || 'beta' }}
      BASE_URL: ${{ inputs.base_url || vars.TEST_BASE_URL || '' }}
      COMPANY_CODE: ${{ secrets.COMPANY_CODE }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      EMPLOYEE_USERNAME: ${{ secrets.EMPLOYEE_USERNAME }}
      EMPLOYEE_PASSWORD: ${{ secrets.EMPLOYEE_PASSWORD }}
      TARGET_MODE: ${{ inputs.target_mode || vars.JIRA_REVIEW_RERUN_MODE || 'test' }}
      JIRA_REVIEW_RERUN_MODE: ${{ vars.JIRA_REVIEW_RERUN_MODE || 'test' }}
      TEST_CASE_ID: ${{ inputs.test_case_id }}
      MODULE: ${{ inputs.module }}
      JIRA_ISSUE: ${{ inputs.jira_issue }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
      JIRA_DEFAULT_ASSIGNEE: ${{ secrets.JIRA_DEFAULT_ASSIGNEE }}
      JIRA_EVIDENCE_MAX_BYTES: ${{ vars.JIRA_EVIDENCE_MAX_BYTES || '5000000' }}
      JIRA_PASS_TRANSITION: ${{ vars.JIRA_PASS_TRANSITION || '' }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      SMTP_SECURE: ${{ vars.SMTP_SECURE || 'false' }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      TESTER_EMAIL: ${{ vars.TESTER_EMAIL }}
      PROJECT_MANAGER_EMAIL: ${{ vars.PROJECT_MANAGER_EMAIL }}
      DEVELOPER_EMAIL: ${{ vars.DEVELOPER_EMAIL }}
      SLEEP_TIME: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate automation configuration
        id: configuration
        continue-on-error: true
        run: npm run validate:config -- runtime
      - name: Install Chromium
        id: browser_install
        continue-on-error: true
        run: npx playwright install --with-deps chromium
      - name: Run fresh targeted verification
        id: playwright
        if: always()
        continue-on-error: true
        run: npx tsx scripts/run-target.ts
      - name: Generate QA summary
        if: always()
        continue-on-error: true
        run: npm run process:results
      - name: Update existing Jira issue
        if: always() && env.JIRA_API_TOKEN != ''
        continue-on-error: true
        run: npm run process:jira
      - name: Send verification email
        if: always() && env.SMTP_HOST != ''
        continue-on-error: true
        run: npm run send:email
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jira-verification-${{ inputs.jira_issue }}
          path: |
            reports/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Restore core automation result
        if: always() && (steps.configuration.outcome == 'failure' || steps.browser_install.outcome == 'failure' || steps.playwright.outcome == 'failure' || steps.unit_test.outcome == 'failure')
        run: exit 1

      - name: Run unit tests
        id: unit_test
        if: always()
        continue-on-error: true
        run: npm run test:unit
